name: Build portable Windows package

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable package
        run: python packaging/build_portable.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-portable-windows
          path: dist/local-agent-portable-windows.zip

      # Versioned releases: pushing a `vX.Y.Z` tag publishes a normal,
      # permanent release for that version.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/local-agent-portable-windows.zip

      # Rolling release: every push to `main` re-publishes a release tagged
      # `latest-build`, overwriting its zip asset (the underlying git tag
      # stays pinned to whichever commit first created it -- GitHub does not
      # move a tag just because a release is updated -- but the asset
      # content itself is always replaced with the newest build, and
      # `make_latest: true` keeps this release marked as GitHub's "latest
      # release" for the repo). This gives a single, permanent public URL
      # that always serves the newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/local-agent-portable-windows.zip
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: Latest build (auto-updated)
          body: >
            Automated rolling build from the latest commit on `main`
            (${{ github.sha }}). This release's asset is replaced on every
            push to `main`, so the download link below always points to the
            newest version.
          make_latest: true
          files: dist/local-agent-portable-windows.zip
