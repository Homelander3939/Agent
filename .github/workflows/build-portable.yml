name: Build portable Windows package

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable package
        run: python packaging/build_portable.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-agent-portable-windows
          path: dist/local-agent-portable-windows.zip

      # Versioned releases: pushing a `vX.Y.Z` tag publishes a normal,
      # permanent release for that version.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/local-agent-portable-windows.zip

      # Rolling "latest" release: every push to `main` re-publishes a
      # release tagged `latest`, overwriting its zip asset. This gives a
      # single, permanent public URL that always serves the newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/local-agent-portable-windows.zip
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto-updated)
          body: >
            Automated rolling build from the latest commit on `main`
            (${{ github.sha }}). This release and its asset are replaced on
            every push, so the download link below always points to the
            newest version.
          make_latest: true
          files: dist/local-agent-portable-windows.zip
