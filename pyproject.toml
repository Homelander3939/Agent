[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent"
version = "0.1.0"
description = "A local-first agentic framework: run coding/browser agents against your own Ollama / LM Studio models, with optional cloud API fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
build = ["pyinstaller>=6.6"]

[project.scripts]
local-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
